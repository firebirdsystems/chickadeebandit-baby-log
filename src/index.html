<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Baby Log</title>
  <style>
    /* `hidden` wins over a class's display (a .field is a grid). */
    [hidden] { display: none !important; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: var(--hub-bg, #f9fafb);
      --surface: var(--hub-surface, #ffffff);
      --border: var(--hub-border, #e5e7eb);
      --border-mid: var(--hub-border, #d1d5db);
      --text: var(--hub-text, #000000);
      --muted: var(--hub-text-muted, #6b7280);
      --accent: var(--hub-primary, #111827);
      --accent-hover: var(--hub-primary-hover, #374151);
      --accent-fg: var(--hub-primary-fg, #ffffff);
      --radius: var(--hub-radius, 10px);
      --green: var(--hub-tint-success-fg, #047857); --green-soft: var(--hub-tint-success, #d1fae5);
      --amber: #b45309; --amber-soft: #fef3c7;
      --red: var(--hub-tint-danger-fg, #b91c1c); --red-soft: var(--hub-tint-danger, #fee2e2);
      --blue: var(--hub-tint-info-fg, #1d4ed8); --blue-soft: var(--hub-tint-info, #dbeafe);

    }
    body {
      min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: var(--hub-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);

    }
    .app { max-width: 720px; margin: 0 auto; padding: 16px; }
    .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    h1 { font-size: 1.35rem; line-height: 1.2; }
    h2 { font-size: .95rem; margin-bottom: 10px; }
    .muted { color: var(--muted); }
    .tiny { font-size: .78rem; }
    .stack { display: grid; gap: 8px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      border: 1px solid transparent; border-radius: 8px; padding: 8px 12px;

    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }

      border: 1px solid var(--border-mid); background: var(--surface); color: var(--text);

      background: var(--surface); border: 1px solid var(--border-mid); border-radius: var(--radius);
      font: inherit; font-size: .78rem; font-weight: 700; cursor: pointer; color: var(--text);
    }

    .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stat { display: grid; gap: 1px; padding: 9px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
    .stat .v { font-size: 1.05rem; font-weight: 800; }
    .stat .k { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; font-weight: 800; }
    .day-head { margin: 16px 2px 6px; font-size: .8rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }

    .edit-link { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: .76rem; font-weight: 700; padding: 2px 4px; }
    .edit-link:hover { color: var(--text); text-decoration: underline; }
    .empty { color: var(--muted); text-align: center; padding: 34px 16px; }

    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.42); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .modal { background: var(--surface); border-radius: 14px; padding: 22px; width: 100%; max-width: 440px; box-shadow: 0 20px 60px rgba(0,0,0,.25); max-height: 92vh; overflow-y: auto; }
    .modal h2 { font-size: 1.05rem; margin-bottom: 16px; }
    .form { display: grid; gap: 12px; }
    .field { display: grid; gap: 5px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    label { font-size: .74rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 800; }
    input, select, textarea {
      width: 100%; border: 1.5px solid var(--border-mid); border-radius: 8px;
      padding: 9px 11px; font: inherit; background: var(--surface); color: var(--text);
    }
    textarea { min-height: 56px; resize: vertical; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
    .modal-actions { display: flex; gap: 8px; margin-top: 6px; justify-content: flex-end; }

    .load-error-retry { background: none; border: 1px solid currentColor; border-radius: 8px; padding: 5px 10px; font: inherit; font-weight: 600; color: inherit; cursor: pointer; flex-shrink: 0; }
    .search-row { margin-bottom: 12px; }
    .shiftbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 12px; margin: 12px 0; flex-wrap: wrap; }
    .shiftbar.on { background: var(--green-soft); border-color: var(--green); color: var(--green); }
    .handoff-card { margin: 12px 0; display: grid; gap: 4px; }

    .shift-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }

    .hours b { color: var(--text); }
    .chart { margin-bottom: 10px; display: grid; gap: 6px; }
    .chart-head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; }
    .chart svg { width: 100%; height: auto; display: block; }
    .search-input {
      width: 100%; border: 1.5px solid var(--border-mid, var(--border, #d1d5db));
      border-radius: 8px; padding: 9px 11px; font: inherit;
      background: var(--surface, var(--card, #fff)); color: var(--text, inherit);
    }
    .search-input:focus { outline: none; border-color: var(--accent, #6366f1); }

<body>
<div class="app">
  <div id="root" class="empty">Loading…</div>
</div>

<script type="module">
import { esc, isAdult, hubConfirm, hubToday, hubTimeZone, searchMatch, glyph } from "/hub-sdk.js";
import {
  ENTRY_TYPES, typeMeta, runningSleepClash, changedFields, fmtDuration, timeAgo, dayKey, groupByDay,
  summarizeDay, runningSleep, ageLabel, entryDetail, feedKindLabel, diaperKindLabel, searchableFields, failureLine,
  unchangedWriteLine, outcomeUnknown, storedDiffers, SAVED_AS_FIRST,
  sortShifts, runningShift, canEditShift, shiftLength, shiftTimesError, latestHandoff, hoursByMember,
  localStamp, defaultUnits, gramsFrom, mmFrom, lbOz, fmtWeight, fmtLength, lengthValue, growthError, sortGrowth,
  growthSeries, chartPoints, ageInDays, whoPercentile, percentileLabel, percentileChart, WHO_MEASURES, defaultRecordRange, recordRangeError, recordUrl,
  REMINDER_KINDS, reminderMinutes, suggestedMinutes, fmtMinutes, reminderChoices, nextReminders,
  TEMP_METHODS, tempC100From, tempValue, fmtTemp, isFever, tempError, medicineError, repeatChoices, recentMedicines, knownMedicine, nextDoses, doseWaits, latestTemperature, healthLineChangesAt,
} from "./logic.js";

const CONTEXT = window.__CONTEXT_URL ?? "";
const DB = window.__DB_URL ?? "";
const HUB_MEMBER = window.__CURRENT_MEMBER ?? null;
const EVENTS = window.__EVENTS_URL ?? "";
const REPORTS_URL = window.__REPORTS_URL ?? "";

// Note the payload: entry_type and amounts only, never `note`. The free-text
// note is the one field a parent may have written something private into.
async function publishEvent(type, subjectId, payload = {}) {
  if (!EVENTS) return;
  try {
    await fetch(EVENTS, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ type, subject_id: subjectId, payload }),
    });
  } catch {
    // The entry is already saved and rendered; publishing is best-effort.
  }
}

let members = [];
let memberMap = new Map();
let me = null;
let babies = [];
let entries = [];
let shifts = [];
let growth = [];
let view = "log";       // "log" | "growth" | "report" | "shifts" | "reminders"
let currentBabyId = null;
let searchQ = "";       // in-app search (see logic.js searchableFields)
let error = "";
let loadFailed = false; // the first load failed: nothing below is known, so nothing is shown as empty
let modalEl = null;
let tickTimer = null;

function nowIso() { return new Date().toISOString(); }
const ENTRY_COLS = "id, baby_id, entry_type, started_at, ended_at, amount_ml, feed_kind, diaper_kind, temp_c100, temp_method, med_name, med_dose, repeat_after_min, note, created_by, created_by_name, created_at";
const SLEEP_RUNNING = "A nap is already running for this child. End that one first.";
// When an entry started on the household's clock, written beside the UTC
// instant for the doctor-visit report (migration 004).
function householdStamp(iso) { return localStamp(iso, hubTimeZone()); }
// Adults manage the children and remove entries. Everyone with the app logs:
// the hub stamps each entry and shift with whoever wrote it, a nanny or
// sitter signed in as a guest included (manifest row_policies).
function canManage() { return !!me && isAdult(me); }
function canLog() { return !!me; }
function memberName(id) { return memberMap.get(id)?.name ?? "Someone"; }
/** The name on a row, else the member's current name: a guest's seat is removed when the job ends. */
function rowName(name, id) { return name || memberName(id); }
function fmtClock(iso) {
  const when = new Date(iso);
  if (Number.isNaN(when.getTime())) return String(iso ?? "");
  return new Intl.DateTimeFormat(undefined, { hour: "numeric", minute: "2-digit" }).format(when);
}
function fmtWhen(iso) {
  const when = new Date(iso);
  if (Number.isNaN(when.getTime())) return String(iso ?? "");
  return new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }).format(when);
}
// "Oct 12, 9:02 AM to 1:15 PM · 4 h 13 min"; the end carries its date when the shift ran past midnight.
function shiftSpan(shift) {
  if (!shift.ended_at) return `Started ${fmtWhen(shift.started_at)}`;
  const sameDay = new Date(shift.started_at).toDateString() === new Date(shift.ended_at).toDateString();
  const length = shiftLength(shift.started_at, shift.ended_at);
  return `${fmtWhen(shift.started_at)} to ${sameDay ? fmtClock(shift.ended_at) : fmtWhen(shift.ended_at)}${length ? ` · ${length}` : ""}`;
}

/* ── DB helper ─────────────────────────────────────────────────────────────── */
async function db(sql, params = []) {
  if (!DB) return { rows: [] };
  const res = await fetch(DB, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sql, params }),
  });
  const json = await res.json().catch(() => null);
  if (!res.ok || !json || typeof json !== "object" || json.error) throw Object.assign(new Error(json?.error || "Couldn’t reach the hub. Try again."), { status: res.status, code: json?.code });
  return json;
}

/* ── Loading ───────────────────────────────────────────────────────────────── */
async function loadMembers() {
  if (!CONTEXT) {
    members = [
      { id: "demo-1", name: "Alex", role: "adult" },
      { id: "demo-2", name: "Jordan", role: "adult" },
      { id: "demo-3", name: "Pat", role: "guest" },
    ];
  } else {
    // A failed read is a failed load, never an empty household.
    const res = await fetch(`${CONTEXT}?keys=family.members`);
    const data = await res.json().catch(() => null);
    if (!res.ok || !data || typeof data !== "object") throw new Error("Couldn’t load members");
    // A 200 can still name a key the hub failed to read: that is a failed load too.
    if (Array.isArray(data.$errors) && data.$errors.includes("family.members")) throw new Error("Couldn’t load members");
    members = data["family.members"] ?? [];
  }
  memberMap = new Map(members.map((m) => [m.id, m]));
  me = HUB_MEMBER ?? members[0] ?? { id: "guest", name: "Guest", role: "adult" };
}

async function loadBabies() {
  if (!DB) {
    babies = [{ id: "demo-baby", name: "Willow", birth_date: "2026-04-20", sex: "female", emoji: "👶", archived: 0, feed_interval_min: 210, wake_window_min: null, max_nap_min: null, created_by: "demo-1", created_at: nowIso() }];
    return;
  }
  const res = await db("SELECT id, name, birth_date, sex, emoji, archived, feed_interval_min, wake_window_min, max_nap_min, created_by, created_at FROM app_baby_log__babies WHERE archived = 0 ORDER BY created_at");
  babies = res.rows ?? [];
}

// Reads of the log land in the order they were started: one that comes back
// after a later one would put the older log back. `stillGood` is a re-read's
// own extra condition.
let readsStarted = 0;
let readsApplied = 0;
let lastReadAt = 0;
async function readInOrder(stillGood = () => true) {
  const id = ++readsStarted;
  const rows = await readEntries();
  if (id < readsApplied || !stillGood()) return false;
  readsApplied = id;
  lastReadAt = Date.now();
  entries = rows;
  return true;
}
async function loadEntries() { return readInOrder(); }

// A read of the log a page makes on its own (a form opening, the page shown
// again) lands only if no write was out at any point while it was: it may have
// been read before that write landed, and would put back a nap just ended, a
// dose just given or a row just removed. `writesOut` counts the writes out;
// `writesDone` moves as each ends, so one that started and ended during the
// read is seen too. Not in the demo, whose log lives only on the page.
let writesOut = 0;
let writesDone = 0;
async function rereadEntries() {
  if (!DB || writesOut) return false;
  const done = writesDone;
  const applied = await readInOrder(() => !writesOut && done === writesDone);
  // Only the log shows entries; a redraw elsewhere would drop a date being typed.
  if (applied && view === "log") render();
  return applied;
}
function trackedWrite(write) {
  return async (...args) => {
    writesOut++;
    try { return await write(...args); } finally { writesOut--; writesDone++; }
  };
}

async function readEntries() {
  if (!DB) {
    const now = Date.now();
    return [
      { id: "e1", baby_id: "demo-baby", entry_type: "feed", started_at: new Date(now - 90 * 60000).toISOString(), ended_at: null, amount_ml: 120, feed_kind: "bottle", diaper_kind: "", note: "", created_by: "demo-3", created_by_name: "Pat", created_at: nowIso() },
      { id: "e2", baby_id: "demo-baby", entry_type: "diaper", started_at: new Date(now - 3 * 3600000).toISOString(), ended_at: null, amount_ml: null, feed_kind: "", diaper_kind: "wet", note: "", created_by: "demo-2", created_by_name: "Jordan", created_at: nowIso() },
      { id: "e3", baby_id: "demo-baby", entry_type: "sleep", started_at: new Date(now - 5 * 3600000).toISOString(), ended_at: new Date(now - 3.5 * 3600000).toISOString(), amount_ml: null, feed_kind: "", diaper_kind: "", note: "", created_by: "demo-1", created_by_name: "Alex", created_at: nowIso() },
    ];
  }
  // Bounded: the timeline shows the recent log; retain_days prunes the rest.
  // Every running nap is read as well, however old: one left running past
  // the newest 400 entries would otherwise be invisible, and the database
  // (one running nap per child, migration 004) would refuse every new start.
  // And the doses on their own: a long wait (weekly drops) outlives 400
  // entries of feeds and diapers.
  const [res, running, medicines] = await Promise.all([
    // Written out, not built from ENTRY_COLS: manifest.preload answers them by their text.
    db("SELECT id, baby_id, entry_type, started_at, ended_at, amount_ml, feed_kind, diaper_kind, temp_c100, temp_method, med_name, med_dose, repeat_after_min, note, created_by, created_by_name, created_at FROM app_baby_log__entries ORDER BY started_at DESC LIMIT 400"),
    db("SELECT id, baby_id, entry_type, started_at, ended_at, amount_ml, feed_kind, diaper_kind, temp_c100, temp_method, med_name, med_dose, repeat_after_min, note, created_by, created_by_name, created_at FROM app_baby_log__entries WHERE entry_type = 'sleep' AND (ended_at IS NULL OR ended_at = '')"),
    readDoses(),
  ]);
  const recent = res.rows ?? [];
  const seen = new Set(recent.map((e) => e.id));
  const more = [...(running.rows ?? []), ...medicines].filter((e) => !seen.has(e.id) && seen.add(e.id));
  return [...recent, ...more];
}

// Every child's recent doses — the widget's read (mobile BabyLogBoard) too.
// Read again when a new dose is saved, so it is judged against the log as it
// is then, not as the page last read it.
async function readDoses() {
  const res = await db("SELECT id, baby_id, entry_type, started_at, ended_at, amount_ml, feed_kind, diaper_kind, temp_c100, temp_method, med_name, med_dose, repeat_after_min, note, created_by, created_by_name, created_at FROM app_baby_log__entries WHERE entry_type = 'medicine' ORDER BY started_at DESC LIMIT 200");
  return res.rows ?? [];
}

// Recent shifts and every one still running, however long ago it started, so
// one nobody ended is never lost. The date param is the household-local day.
const SHIFTS_SQL = "SELECT id, member_id, member_name, started_at, ended_at, shift_date, summary, handoff, created_at, updated_at FROM app_baby_log__shifts WHERE ended_at = '' OR started_at >= date(?, '-30 days') ORDER BY started_at DESC, id DESC";
async function loadShifts() {
  if (!DB) {
    const now = Date.now();
    shifts = [
      { id: "s1", member_id: "demo-3", member_name: "Pat", started_at: new Date(now - 26 * 3600000).toISOString(), ended_at: new Date(now - 17 * 3600000).toISOString(), shift_date: hubToday(), summary: "Two bottles, a long morning nap, park after lunch.", handoff: "Last bottle at 4:40. Teething gel on the counter.", created_at: nowIso(), updated_at: nowIso() },
    ];
    return;
  }
  const res = await db(SHIFTS_SQL, [hubToday()]);
  shifts = sortShifts(res.rows ?? []);
}

// Every measurement, not a recent window: a growth curve needs the first one.
// Bounded only so a runaway table cannot stall the page.
const GROWTH_COLS = "id, baby_id, measured_date, weight_g, length_mm, head_mm, note, created_by, created_by_name, created_at";
async function loadGrowth() {
  if (!DB) {
    growth = [
      { id: "g1", baby_id: "demo-baby", measured_date: "2026-04-20", weight_g: 3400, length_mm: 500, head_mm: 345, note: "Birth", created_by: "demo-1", created_by_name: "Alex", created_at: nowIso() },
      { id: "g2", baby_id: "demo-baby", measured_date: "2026-05-04", weight_g: 3650, length_mm: 515, head_mm: 355, note: "Two-week check-up", created_by: "demo-1", created_by_name: "Alex", created_at: nowIso() },
      { id: "g3", baby_id: "demo-baby", measured_date: "2026-06-20", weight_g: 5100, length_mm: 565, head_mm: 385, note: "", created_by: "demo-2", created_by_name: "Jordan", created_at: nowIso() },
    ];
    growth = sortGrowth(growth);
    return;
  }
  // Written out in full: manifest.preload matches this text (preload.test.mjs).
  const res = await db("SELECT id, baby_id, measured_date, weight_g, length_mm, head_mm, note, created_by, created_by_name, created_at FROM app_baby_log__growth ORDER BY measured_date DESC, created_at DESC LIMIT 500");
  growth = sortGrowth(res.rows ?? []);
}

async function refresh() {
  error = "";
  try {
    await Promise.all([loadMembers(), loadBabies(), loadEntries(), loadShifts(), loadGrowth()]);
    if (!currentBabyId || !babies.some((b) => b.id === currentBabyId)) currentBabyId = babies[0]?.id ?? null;
    loadFailed = false;
    render();
  } catch { loadFailed = true; render(); return; }
  loadReminderStatus();
}

function showError(msg) { error = msg; render(); }

// A save the hub refused: the form stays open as typed, says so in its own
// error line, and its button works again. With no form open (the sleep
// timer), the page's error line carries the message instead.
function saveFailed(e, words, text = failureLine(e, words)) {
  if (e) console.error(e);
  const line = modalEl?.querySelector("[data-form-error]");
  if (!line) { showError(text); return; }
  line.textContent = text;
  line.hidden = false;
  const btn = modalEl.querySelector('button[type="submit"]');
  if (btn) { btn.disabled = false; btn.textContent = btn.dataset.label ?? btn.textContent; }
}

/** A plain `WHERE id = ?` write's `changed`; 0 means no row took it. No DB (demo): taken. */
function changedNothing(res) { return !!DB && !Number(res?.changed); }

/** Re-read after a write that changed nothing: true = no row, false = still there, undefined = the read failed. */
async function rowGone(table, id) {
  try { return !(await db(`SELECT id FROM ${table} WHERE id = ?`, [id])).rows?.length; }
  catch (e) { console.error(e); return undefined; }
}

/**
 * Retry after a lost response: a create whose answer leaves the outcome
 * unknown is read back by its pinned id. Returns the stored row when an
 * earlier try landed, else null (the save failed; the id stays pinned), or
 * undefined when the read-back itself failed.
 */
async function landedUnheard(e, table, cols, id) {
  if (!DB || !outcomeUnknown(e)) return null;
  try { return (await db(`SELECT ${cols} FROM ${table} WHERE id = ?`, [id])).rows?.[0] ?? null; }
  catch (readErr) { console.error(readErr); return undefined; }
}

/* ── Mutations ─────────────────────────────────────────────────────────────── */
async function addBaby(fields, form) {
  // The id is the form's, minted on its first Add and sent on every retry: a
  // try whose answer was lost may have stored the child, and a second press
  // must find that row rather than add another.
  const id = form ? (form.dataset.rowId ??= crypto.randomUUID()) : crypto.randomUUID();
  let row = { id, name: fields.name, birth_date: fields.birth_date, sex: fields.sex, emoji: "👶", archived: 0, created_by: me.id, created_at: nowIso() };
  let note = "";
  // The form stays open until the hub has the child: nothing is drawn for a
  // row the hub never got.
  try {
    await db("INSERT INTO app_baby_log__babies (id, name, birth_date, sex, emoji, archived, created_by, created_at) VALUES (?,?,?,?,?,0,?,?)",
      [row.id, row.name, row.birth_date, row.sex, row.emoji, row.created_by, row.created_at]);
  } catch (e) {
    const stored = await landedUnheard(e, "app_baby_log__babies", "id, name, birth_date, sex, emoji, archived, created_by, created_at", id);
    // The id is ours: with the read-back failed (undefined), a UNIQUE answer may be
    // this form's own first try, so nothing is known — "try again", not "already exists".
    if (!stored) { const words = { action: "add the child", thing: "child" }; saveFailed(e, words, failureLine(stored === undefined ? null : e, words)); return; }
    console.error(e);
    if (storedDiffers(stored, fields)) note = SAVED_AS_FIRST;
    row = stored;
  }
  if (form) delete form.dataset.rowId;
  babies = [...babies.filter((b) => b.id !== row.id), row];
  currentBabyId = row.id;
  error = note;
  closeModal();
  render();
}

async function archiveBaby(id) {
  const ok = await hubConfirm({ message: "Archive this child?", description: "The log stays in the database but the child is hidden from the app.", confirmLabel: "Archive", destructive: true });
  if (!ok) return;
  const prev = babies;
  babies = babies.filter((b) => b.id !== id);
  if (currentBabyId === id) currentBabyId = babies[0]?.id ?? null;
  closeModal();
  render();
  const words = { action: "archive the child", thing: "child" };
  let res;
  try {
    res = await db("UPDATE app_baby_log__babies SET archived = 1 WHERE id = ?", [id]);
  } catch (e) { console.error(e); babies = prev; showError(failureLine(e, words)); return; }
  // Nothing archived: the re-read says why. Gone: it stays off the list.
  // Still there: the row policy refused it, and it comes back.
  if (changedNothing(res)) {
    const gone = await rowGone("app_baby_log__babies", id);
    if (gone !== true) babies = prev;
    showError(unchangedWriteLine(gone, words));
  }
}

// Girl or boy, for the growth tab's WHO percentiles. Adults only, as every
// other change to a child is (the babies row policy).
async function setBabySex(id, sex) {
  const prev = babies;
  babies = babies.map((b) => (b.id === id ? { ...b, sex } : b));
  render();
  const words = { action: "save the child", thing: "child" };
  let res;
  try { res = await db("UPDATE app_baby_log__babies SET sex = ? WHERE id = ?", [sex, id]); }
  catch (e) { console.error(e); babies = prev; showError(failureLine(e, words)); return; }
  if (changedNothing(res)) {
    const gone = await rowGone("app_baby_log__babies", id);
    babies = gone === true ? prev.filter((b) => b.id !== id) : prev;
    showError(unchangedWriteLine(gone, words));
  }
}

// How long each reminder waits, for one child. Adults only (the babies row
// policy). The hub reads these columns on its next run; the status is re-read
// so the tab shows what the hub now watches.
let savingReminders = false;
async function saveReminders(id, values) {
  if (savingReminders) return;
  savingReminders = true;
  const prev = babies;
  babies = babies.map((b) => (b.id === id ? { ...b, ...values } : b));
  error = "";
  render();
  const words = { action: "save the reminders", thing: "child" };
  let res, failure = null;
  try {
    res = await db("UPDATE app_baby_log__babies SET feed_interval_min = ?, wake_window_min = ?, max_nap_min = ? WHERE id = ?",
      [values.feed_interval_min, values.wake_window_min, values.max_nap_min, id]);
  } catch (e) { console.error(e); failure = failureLine(e, words); }
  if (!failure && changedNothing(res)) {
    const gone = await rowGone("app_baby_log__babies", id);
    babies = gone === true ? prev.filter((b) => b.id !== id) : prev;
    failure = unchangedWriteLine(gone, words);
  } else if (failure) babies = prev;
  savingReminders = false;
  if (failure) { showError(failure); return; }
  render();
  loadReminderStatus();
}

const saveEntry = trackedWrite(async function saveEntry(fields, existingId, pinHost = null, opened = null) {
  const now = nowIso();
  if (existingId) {
    const words = { action: "save the entry", thing: "entry" };
    // Only what this form changed is written. Two people may have the same
    // entry open: a parent ends a nap while the nanny adds a note to it, and
    // the nanny's save must not write back the empty end her form opened with.
    const set = changedFields(opened, fields);
    if ("started_at" in set) set.local_at = householdStamp(set.started_at);
    const cols = Object.keys(set);
    if (!cols.length) { error = ""; closeModal(); render(); return; }
    // The form stays open until the hub has the edit (see saveFailed).
    let res;
    try {
      res = await db(`UPDATE app_baby_log__entries SET ${cols.map((c) => `${c} = ?`).join(", ")} WHERE id = ?`, [...cols.map((c) => set[c]), existingId]);
    } catch (e) {
      // Emptying a nap's end while another nap runs for the child.
      if (runningSleepClash(e, fields)) { console.error(e); saveFailed(null, words, SLEEP_RUNNING); return; }
      saveFailed(e, words);
      return;
    }
    // No row took the edit: the form stays as typed and says why. A row that
    // is gone leaves the list behind it too.
    if (changedNothing(res)) {
      const gone = await rowGone("app_baby_log__entries", existingId);
      if (gone === true) { entries = entries.filter((x) => x.id !== existingId); render(); }
      saveFailed(null, words, unchangedWriteLine(gone, words));
      return;
    }
    // Read back: the row holds this edit and whatever someone else changed
    // meanwhile (an end another caregiver set), and the list shows that.
    let stored = null;
    try { stored = (await db(`SELECT ${ENTRY_COLS} FROM app_baby_log__entries WHERE id = ?`, [existingId])).rows?.[0] ?? null; }
    catch (readErr) { console.error(readErr); }
    entries = entries.map((x) => (x.id === existingId ? (stored ?? { ...x, ...set }) : x));
    error = "";
    closeModal();
    render();
  } else {
    // The id is pinned on the form (or the sleep timer) on its first try and
    // sent on every retry: a try whose answer was lost may have stored the
    // entry, and a second press must find it rather than log it twice.
    const id = pinHost ? (pinHost.rowId ??= crypto.randomUUID()) : crypto.randomUUID();
    // Every column the INSERT names, so a caller passing only some (the sleep
    // timer) sends the column's empty value, never a NULL a NOT NULL column refuses.
    let row = { id, baby_id: currentBabyId, ended_at: null, amount_ml: null, feed_kind: "", diaper_kind: "", temp_c100: null, temp_method: "", med_name: "", med_dose: "", repeat_after_min: null, note: "", ...fields, created_by: me.id, created_by_name: me.name ?? "", created_at: now };
    let note = "";
    try {
      await db(
        "INSERT INTO app_baby_log__entries (id, baby_id, entry_type, started_at, local_at, ended_at, amount_ml, feed_kind, diaper_kind, temp_c100, temp_method, med_name, med_dose, repeat_after_min, note, created_by, created_by_name, created_at) VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)",
        [row.id, row.baby_id, row.entry_type, row.started_at, householdStamp(row.started_at), row.ended_at, row.amount_ml, row.feed_kind, row.diaper_kind, row.temp_c100, row.temp_method, row.med_name, row.med_dose, row.repeat_after_min, row.note, row.created_by, row.created_by_name, row.created_at],
      );
    } catch (e) {
      const stored = await landedUnheard(e, "app_baby_log__entries", ENTRY_COLS, id);
      // Not ours, and UNIQUE on a running nap: someone else started one for
      // this child first (one running nap per child, migration 004). Nothing
      // was stored; the log is read again so it shows the nap that is running.
      if (stored === null && runningSleepClash(e, fields)) {
        console.error(e);
        if (pinHost) delete pinHost.rowId;
        try { await loadEntries(); } catch (readErr) { console.error(readErr); }
        render();
        saveFailed(null, { action: "save the entry", thing: "entry" }, SLEEP_RUNNING);
        return;
      }
      if (!stored) {
        // A refusal the hub named stored nothing: the next try may mint afresh.
        if (pinHost && !outcomeUnknown(e)) delete pinHost.rowId;
        // The read-back found no row: nothing stored the first try's values.
        else if (pinHost && stored === null) pinHost.unstored = true;
        // A failed read-back (undefined) leaves the outcome unknown: "try again".
        const words = { action: "save the entry", thing: "entry" };
        saveFailed(e, words, failureLine(stored === undefined ? null : e, words));
        return;
      }
      console.error(e);
      // Edited since that first try: what was stored is kept, and said so.
      if (storedDiffers(stored, fields)) note = SAVED_AS_FIRST;
      row = stored;
    }
    if (pinHost) delete pinHost.rowId;
    entries = [row, ...entries.filter((x) => x.id !== row.id)];
    error = note;
    closeModal();
    render();
    // Only once the entry exists; a failed publish is not a failed save.
    // Not awaited: best-effort, and awaiting it would keep this write counted
    // as out (trackedWrite) and hold off the page's re-reads until it answered.
    publishEvent("baby.entry_logged", row.id, {
      baby_id: row.baby_id,
      entry_type: row.entry_type,
      started_at: row.started_at,
      amount_ml: row.amount_ml,
    });
  }
});

// The confirm is asked before the write is counted as out: a dialog left open
// is not a write, and must not hold off the page's re-reads.
async function deleteEntry(id) {
  const ok = await hubConfirm({ message: "Delete this entry?", confirmLabel: "Delete", destructive: true });
  if (ok) await removeEntry(id);
}
const removeEntry = trackedWrite(async function removeEntry(id) {
  const prev = entries;
  entries = entries.filter((e) => e.id !== id);
  closeModal();
  render();
  const words = { action: "delete the entry", thing: "entry" };
  let res;
  try { res = await db("DELETE FROM app_baby_log__entries WHERE id = ?", [id]); }
  catch (e) { console.error(e); entries = prev; showError(failureLine(e, words)); return; }
  // Nothing deleted: the re-read says why. Gone already: it stays off the
  // list. Still there: the row policy refused it, and it comes back.
  if (changedNothing(res)) {
    const gone = await rowGone("app_baby_log__entries", id);
    if (gone !== true) entries = prev;
    showError(unchangedWriteLine(gone, words));
  }
});

// The sleep timer's pending start per baby: its id and start time are kept
// until the outcome is known, so a second tap after a lost answer finds the first.
const sleepPins = new Map();

/** Toggle the sleep timer: start a running entry, or stamp ended_at on it. */
const toggleSleep = trackedWrite(async function toggleSleep() {
  const babyId = currentBabyId;
  let pin = sleepPins.get(babyId);
  // A pinned start a later load found stored is settled.
  if (pin && entries.some((e) => e.id === pin.rowId)) { sleepPins.delete(babyId); pin = null; }
  const running = runningSleep(entries, currentBabyId);
  if (running) {
    const words = { action: "stop the sleep timer", thing: "entry" };
    const endedAt = nowIso();
    const prev = entries;
    entries = entries.map((e) => (e.id === running.id ? { ...running, ended_at: endedAt } : e));
    render();
    let res;
    // Only a nap that is still running: a page that has not seen another
    // caregiver end it must not move the wake-up time they recorded.
    try { res = await db("UPDATE app_baby_log__entries SET ended_at = ? WHERE id = ? AND (ended_at IS NULL OR ended_at = '')", [endedAt, running.id]); }
    catch (e) { console.error(e); entries = prev; showError(failureLine(e, words)); return; }
    if (changedNothing(res)) {
      let stored;
      try { stored = (await db(`SELECT ${ENTRY_COLS} FROM app_baby_log__entries WHERE id = ?`, [running.id])).rows?.[0] ?? null; }
      catch (e) { console.error(e); entries = prev; showError(failureLine(null, words)); return; }
      // Ended already, here or elsewhere: the time it was ended at stands.
      if (stored?.ended_at) {
        entries = prev.map((e) => (e.id === stored.id ? stored : e));
        showError("This nap had already been ended. The log shows when.");
        return;
      }
      entries = stored ? prev : prev.filter((e) => e.id !== running.id);
      showError(unchangedWriteLine(stored ? false : true, words));
    }
  } else {
    if (!pin) sleepPins.set(babyId, (pin = { started_at: nowIso() }));
    // A start already on its way: a second tap is ignored.
    else if (pin.inFlight) return;
    // A read-back found the last try unstored: same id, the start is now.
    else if (pin.unstored) { pin.started_at = nowIso(); delete pin.unstored; }
    pin.inFlight = true;
    try {
      await saveEntry({ entry_type: "sleep", started_at: pin.started_at, ended_at: null, amount_ml: null, feed_kind: "", diaper_kind: "", note: "" }, null, pin);
    } finally { pin.inFlight = false; }
    // Settled (saved, or refused outright): the next start is a new one.
    if (!pin.rowId && sleepPins.get(babyId) === pin) sleepPins.delete(babyId);
  }
});

/* ── Shifts ────────────────────────────────────────────────────────────────── */
// A nanny or sitter's day: started, ended, what was done, and a handoff note
// the next person reads first. Anyone with the app may log one; the hub
// stamps it with them. The writer or any adult may correct it; only an adult
// may remove it.
const SHIFT_COLS = "id, member_id, member_name, started_at, ended_at, shift_date, summary, handoff, created_at, updated_at";

// Set while a start is on its way: the new shift only joins the list once the
// hub has answered, so without this a second tap in that gap starts another.
let startingShift = false;
// The pending start: its row is minted on the first tap and sent on every
// retry until the outcome is known. A try whose answer was lost may have
// stored the shift, and the next tap must find that row rather than open a
// second shift that nobody would ever end.
let shiftPin = null;
async function startShift() {
  if (startingShift || !canLog() || runningShift(shifts, me.id)) return;
  // A pinned start a later load found stored is settled.
  if (shiftPin && shifts.some((x) => x.id === shiftPin.id)) shiftPin = null;
  startingShift = true;
  if (!shiftPin || shiftPin.unstored) {
    // A read-back found the last try unstored: same id, but the start is now.
    const now = nowIso();
    shiftPin = { id: shiftPin?.id ?? crypto.randomUUID(), member_id: me.id, member_name: me.name ?? "", started_at: now, ended_at: "", shift_date: hubToday(new Date(now)), summary: "", handoff: "", created_at: now, updated_at: now };
  }
  let row = shiftPin;
  try {
    if (DB) await db(`INSERT INTO app_baby_log__shifts (${SHIFT_COLS}) VALUES (?,?,?,?,?,?,?,?,?,?)`,
      [row.id, row.member_id, row.member_name, row.started_at, row.ended_at, row.shift_date, row.summary, row.handoff, row.created_at, row.updated_at]);
  } catch (e) {
    const stored = await landedUnheard(e, "app_baby_log__shifts", SHIFT_COLS, row.id);
    // Not ours, and UNIQUE: this person already has a shift running, started
    // from another tab or device (the one-running index, migration 003). The
    // list is read again so it shows that shift; nothing new was stored.
    if (stored === null && (e?.code === "UNIQUE_CONSTRAINT" || /UNIQUE constraint failed/i.test(String(e?.message ?? "")))) {
      console.error(e);
      shiftPin = null;
      startingShift = false;
      try { await loadShifts(); error = runningShift(shifts, me.id) ? "" : "Couldn’t start the shift — try again."; }
      catch (readErr) { console.error(readErr); error = "Couldn’t start the shift — try again."; }
      render();
      return;
    }
    if (!stored) {
      // A refusal the hub named stored nothing: the next tap may mint afresh.
      // Otherwise the pin stays, and the next tap sends the same row.
      if (!outcomeUnknown(e)) shiftPin = null;
      else if (stored === null) shiftPin.unstored = true;
      const words = { action: "start the shift", thing: "shift" };
      console.error(e);
      showError(failureLine(stored === undefined ? null : e, words));
      startingShift = false;
      return;
    }
    console.error(e);
    row = stored;
  }
  shiftPin = null;
  shifts = sortShifts([row, ...shifts.filter((x) => x.id !== row.id)]);
  error = "";
  startingShift = false;
  render();
}

/** Reads one shift again and puts it in the list in place of the copy held; drops it when it is gone. */
async function refreshShift(id) {
  const row = (await db(`SELECT ${SHIFT_COLS} FROM app_baby_log__shifts WHERE id = ?`, [id])).rows?.[0] ?? null;
  shifts = row ? sortShifts(shifts.map((x) => (x.id === id ? row : x))) : shifts.filter((x) => x.id !== id);
  return row;
}

/**
 * Writes the form's fields to a shift. Guarded on `updated_at`: two people
 * may write the same shift (the nanny ending it, a parent correcting it),
 * and neither page refreshes, so a write that finds the row moved on changes
 * nothing, the row is read again, and the form says so.
 *
 * The new stamp is pinned on the form (`pinHost.stamp`) on its first try and
 * sent on every retry. A try whose answer was lost may have landed; the retry
 * then changes nothing, and the re-read finding this form's own stamp is
 * what says the save went through rather than "changed by someone else".
 */
async function saveShift(id, fields, pinHost, rewrite = false) {
  const words = { action: "save the shift", thing: "shift" };
  const shift = shifts.find((x) => x.id === id);
  if (!shift || !canEditShift(me, shift, isAdult(me))) return;
  const stamp = (pinHost.stamp ??= nowIso());
  const set = { ...fields, updated_at: stamp };
  const cols = Object.keys(set);
  let res;
  try {
    res = await db(`UPDATE app_baby_log__shifts SET ${cols.map((c) => `${c} = ?`).join(", ")} WHERE id = ? AND updated_at = ?`, [...cols.map((c) => set[c]), id, shift.updated_at]);
  } catch (e) { saveFailed(e, words); return; }
  if (changedNothing(res)) {
    let fresh;
    try { fresh = await refreshShift(id); } catch (e) { console.error(e); saveFailed(null, words); return; }
    // Our own earlier try landed: refreshShift has put the stored row in the list.
    if (fresh && fresh.updated_at === stamp) {
      delete pinHost.stamp;
      // The form was changed after that try: write what it holds now, once,
      // guarded on the stamp that landed. Otherwise the save is done.
      if (!rewrite && storedDiffers(fresh, fields)) return saveShift(id, fields, pinHost, true);
      error = ""; closeModal(); render(); return;
    }
    // Gone, or moved on under us: the list now shows it as the hub holds it.
    if (fresh) render();
    saveFailed(null, words, unchangedWriteLine(fresh ? false : true, words));
    return;
  }
  delete pinHost.stamp;
  shifts = sortShifts(shifts.map((x) => (x.id === id ? { ...x, ...set } : x)));
  error = "";
  closeModal();
  render();
}

async function deleteShift(id) {
  const ok = await hubConfirm({ message: "Remove this shift?", confirmLabel: "Remove", destructive: true });
  if (!ok) return;
  const prev = shifts;
  shifts = shifts.filter((s) => s.id !== id);
  closeModal();
  render();
  const words = { action: "remove the shift", thing: "shift" };
  let res;
  try { res = await db("DELETE FROM app_baby_log__shifts WHERE id = ?", [id]); }
  catch (e) { console.error(e); shifts = prev; showError(failureLine(e, words)); return; }
  if (changedNothing(res)) {
    const gone = await rowGone("app_baby_log__shifts", id);
    if (gone !== true) shifts = prev;
    showError(unchangedWriteLine(gone, words));
  }
}

// Ends the viewer's running shift (`end`), or corrects any shift they may edit.
function openShiftEditor(id, end = false) {
  const shift = shifts.find((x) => x.id === id);
  if (!shift || !canEditShift(me, shift, isAdult(me))) return;
  const whose = shift.member_id !== me?.id ? ` for ${esc(rowName(shift.member_name, shift.member_id))}` : "";
  const endValue = end ? localDatetimeValue(nowIso()) : shift.ended_at ? localDatetimeValue(shift.ended_at) : "";
  openModal(`
    <h2>${end ? "End shift" : `Edit the shift${whose}`}</h2>
    <form class="form" id="shift-form">
      <div class="grid2">
        <div class="field"><label for="sh-start">Started</label><input id="sh-start" type="datetime-local" value="${esc(localDatetimeValue(shift.started_at))}" required /></div>
        <div class="field"><label for="sh-end">Ended</label><input id="sh-end" type="datetime-local" value="${esc(endValue)}" ${end ? "required" : ""} /></div>
      </div>
      ${end ? "" : `<p class="muted tiny">Leave Ended empty while the shift is still running.</p>`}
      <div class="field"><label for="sh-summary">What was done</label><textarea id="sh-summary" ${end ? "data-autofocus" : ""} placeholder="Bottles, naps, where you went, anything out of the ordinary">${esc(shift.summary ?? "")}</textarea></div>
      <div class="field"><label for="sh-handoff">Handoff note</label><textarea id="sh-handoff" placeholder="What the next person should know">${esc(shift.handoff ?? "")}</textarea></div>
      <div class="error" data-form-error data-testid="modal-error" role="alert" hidden></div>
      <div class="modal-actions">
        ${canManage() ? `<button type="button" class="btn btn-danger modal-left" data-delete-shift="${esc(shift.id)}">Remove</button>` : ""}
        <button type="button" class="btn btn-ghost" data-cancel>Cancel</button>
        <button type="submit" class="btn">${end ? "End shift" : "Save"}</button>
      </div>
    </form>`);
  modalEl.querySelector("[data-autofocus]")?.focus();
  modalEl.querySelector("#shift-form").addEventListener("submit", (ev) => {
    ev.preventDefault();
    const line = ev.currentTarget.querySelector("[data-form-error]");
    const toIso = (raw) => { const d = new Date(raw); return Number.isNaN(d.getTime()) ? null : d.toISOString(); };
    const startRaw = document.getElementById("sh-start").value;
    const endRaw = document.getElementById("sh-end").value;
    const startedAt = startRaw ? toIso(startRaw) : "";
    const endedAt = endRaw ? toIso(endRaw) : (end ? null : "");
    const problem = shiftTimesError(startedAt ?? "", endedAt);
    if (problem) { line.textContent = problem; line.hidden = false; return; }
    line.hidden = true;
    const btn = modalEl?.querySelector('button[type="submit"]');
    if (btn) { btn.dataset.label = btn.textContent; btn.disabled = true; btn.textContent = "Saving…"; }
    saveShift(shift.id, {
      started_at: startedAt,
      ended_at: endedAt,
      // The household's calendar day the shift STARTED on, so a corrected start moves it.
      shift_date: hubToday(startedAt),
      summary: document.getElementById("sh-summary").value.trim(),
      handoff: document.getElementById("sh-handoff").value.trim(),
    }, ev.currentTarget.dataset).catch((err) => saveFailed(err, { action: "save the shift", thing: "shift" }));
  });
}

// On the log: the viewer's running shift, or the button to start one.
function shiftBarHtml() {
  if (!canLog()) return "";
  const mine = runningShift(shifts, me.id);
  if (mine) {
    return `<div class="card shiftbar on" data-testid="shift-bar"><span>On shift since ${esc(fmtClock(mine.started_at))}</span><button class="btn btn-sm" data-end-shift="${esc(mine.id)}">End shift</button></div>`;
  }

/* ── Growth ────────────────────────────────────────────────────────────────── */
// Weight, length and head size. Stored in grams and millimetres; shown in the
// units this viewer picks, remembered on this device only.
const UNITS_KEY = "baby-log-units";
let units = (() => {
  try { const saved = localStorage.getItem(UNITS_KEY); if (saved === "metric" || saved === "imperial") return saved; } catch { /* storage blocked */ }
  return defaultUnits(navigator.language);
})();
function setUnits(next) {
  units = next;
  try { localStorage.setItem(UNITS_KEY, next); } catch { /* storage blocked: kept for this visit */ }
  render();
}

async function saveGrowth(fields, existingId, form) {
  const words = { action: "save the measurement", thing: "measurement" };
  if (existingId) {
    let res;
    try {
      res = await db("UPDATE app_baby_log__growth SET measured_date=?, weight_g=?, length_mm=?, head_mm=?, note=? WHERE id=?",
        [fields.measured_date, fields.weight_g, fields.length_mm, fields.head_mm, fields.note, existingId]);
    } catch (e) { saveFailed(e, words); return; }
    if (changedNothing(res)) {
      const gone = await rowGone("app_baby_log__growth", existingId);
      if (gone === true) { growth = growth.filter((x) => x.id !== existingId); render(); }
      saveFailed(null, words, unchangedWriteLine(gone, words));
      return;
    }
    growth = sortGrowth(growth.map((g) => (g.id === existingId ? { ...g, ...fields } : g)));
  } else {
    // Pinned on the form and sent on every retry, as entries are.
    const id = (form.dataset.rowId ??= crypto.randomUUID());
    let row = { id, baby_id: currentBabyId, ...fields, created_by: me.id, created_by_name: me.name ?? "", created_at: nowIso() };
    let note = "";
    try {
      await db(`INSERT INTO app_baby_log__growth (${GROWTH_COLS}) VALUES (?,?,?,?,?,?,?,?,?,?)`,
        [row.id, row.baby_id, row.measured_date, row.weight_g, row.length_mm, row.head_mm, row.note, row.created_by, row.created_by_name, row.created_at]);
    } catch (e) {
      const stored = await landedUnheard(e, "app_baby_log__growth", GROWTH_COLS, id);
      if (!stored) {
        if (!outcomeUnknown(e)) delete form.dataset.rowId;
        saveFailed(e, words, failureLine(stored === undefined ? null : e, words));
        return;
      }
      console.error(e);
      if (storedDiffers(stored, fields)) note = SAVED_AS_FIRST;
      row = stored;
    }
    delete form.dataset.rowId;
    growth = sortGrowth([row, ...growth.filter((x) => x.id !== row.id)]);
    error = note;
    closeModal();
    render();
    return;
  }
  error = "";
  closeModal();
  render();
}

async function deleteGrowth(id) {
  const ok = await hubConfirm({ message: "Delete this measurement?", confirmLabel: "Delete", destructive: true });
  if (!ok) return;
  const prev = growth;
  growth = growth.filter((g) => g.id !== id);
  closeModal();
  render();
  const words = { action: "delete the measurement", thing: "measurement" };
  let res;
  try { res = await db("DELETE FROM app_baby_log__growth WHERE id = ?", [id]); }
  catch (e) { console.error(e); growth = prev; showError(failureLine(e, words)); return; }
  if (changedNothing(res)) {
    const gone = await rowGone("app_baby_log__growth", id);
    if (gone !== true) growth = prev;
    showError(unchangedWriteLine(gone, words));
  }
}

function openGrowthEditor(existing) {

  modalEl.querySelector("#growth-form").addEventListener("submit", (ev) => {
    ev.preventDefault();
    const val = (id) => document.getElementById(id)?.value ?? "";
    // A measure whose fields still hold what the form opened with keeps its
    // stored value: the form shows it rounded (0.1 oz, 0.1 in), and converting
    // that back would move a number nobody changed.
    const untouched = (...ids) => !!g && ids.every((id) => val(id) === (opened[id] ?? ""));
    const fields = {
      measured_date: val("g-date"),
      weight_g: untouched("g-lb", "g-oz", "g-kg") ? g.weight_g : gramsFrom({ units, lb: val("g-lb"), oz: val("g-oz"), kg: val("g-kg") }),
      length_mm: untouched("g-length") ? g.length_mm : mmFrom(val("g-length"), units),
      head_mm: untouched("g-head") ? g.head_mm : mmFrom(val("g-head"), units),
      note: val("g-note").trim(),

    const problem = growthError(fields, hubToday());
    if (problem) { line.textContent = problem; line.hidden = false; return; }
    line.hidden = true;

    if (btn) { btn.dataset.label = btn.textContent; btn.disabled = true; btn.textContent = "Saving…"; }
    saveGrowth(fields, g?.id ?? null, ev.currentTarget).catch((err) => saveFailed(err, { action: "save the measurement", thing: "measurement" }));
  });
}

function fmtDay(date) {
  const d = new Date(`${date}T12:00:00`);
  return Number.isNaN(d.getTime()) ? String(date ?? "") : new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric", year: "numeric" }).format(d);
}

// One measure over time. With the child's sex and birth date, and every
// measurement inside birth to 24 months, it is drawn by age over the WHO
// percentile lines; otherwise by date on its own.
function growthChartHtml(baby, rows, key, title, fmt) {
  const series = growthSeries(rows, key);
  if (!series.length) return "";
  const W = 320, H = 130;
  const first = series[0], last = series.at(-1);
  const pct = whoPercentile(key, last.value, baby.sex, baby.birth_date, last.date);
  const byAge = baby.sex
    ? percentileChart(series.map((p) => ({ ...p, days: ageInDays(baby.birth_date, p.date) })), key, baby.sex, W, H, 10)
    : null;
  const dots = byAge ? byAge.dots : chartPoints(series, W, H, 10);
  const bands = byAge ? byAge.lines.map((l) => `
        <polyline fill="none" stroke="${l.z === 0 ? "var(--muted)" : "var(--border-mid)"}" stroke-width="${l.z === 0 ? 1.2 : 0.8}" points="${l.points.map((q) => `${q.x},${q.y}`).join(" ")}" />
        ${l.label === "2nd" || l.label === "50th" || l.label === "98th" ? `<text x="${W - 2}" y="${l.points.at(-1).y - 2}" text-anchor="end" font-size="8" fill="var(--muted)">${l.label}</text>` : ""}`).join("") : "";
  return `
    <div class="card chart" data-testid="growth-chart" data-measure="${esc(key)}">
      <div class="chart-head"><strong>${esc(title)}</strong><span class="muted tiny">${series.length > 1 ? `${esc(fmt(first.value))} on ${esc(fmtDay(first.date))} → ` : ""}${esc(fmt(last.value))} on ${esc(fmtDay(last.date))}${pct != null ? ` · <span data-testid="latest-percentile">${esc(percentileLabel(pct))} percentile</span>` : ""}</span></div>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)} over ${byAge ? "age, with the WHO percentile lines" : "time"}">
        ${bands}
        ${dots.length > 1 ? `<polyline fill="none" stroke="var(--accent)" stroke-width="2" points="${dots.map((q) => `${q.x},${q.y}`).join(" ")}" />` : ""}
        ${dots.map((q) => `<circle cx="${q.x}" cy="${q.y}" r="3.5" fill="var(--accent)"><title>${esc(fmtDay(q.date))}: ${esc(fmt(q.value))}</title></circle>`).join("")}
      </svg>
    </div>`;
}

/* ── Reminders ─────────────────────────────────────────────────────────────── */
// The hub sends them (manifest interval_reminders); this tab stores how long
// each one waits and shows what the hub is watching. The status is the hub's
// answer for the household: whether reminders run here at all (not yet in a
// shared space), which ones are over the household's allowance, and whether
// the follow-up alert is part of the plan. The hub refuses a guest the
// status, and only an adult may change a child, so the tab is adults' only.
const REMINDER_STATUS = "api/reminders-interval-status";
let reminderStatus = null;          // the hub's answer, or null while unknown
let reminderStatusFailed = false;
async function loadReminderStatus() {
  if (!canManage() || me?.role === "guest") return;
  if (!DB) {
    reminderStatus = {
      entitled: true, escalation_entitled: true, context_unsupported: false, cap: 10, app_monitored_count: 1, unmonitored: [],
    };
    render();
    return;
  }
  try {
    const res = await fetch(REMINDER_STATUS, { headers: { Accept: "application/json" } });
    const body = res.ok ? await res.json().catch(() => null) : null;
    if (!body || typeof body !== "object" || body.error) throw new Error(`reminder status ${res.status}`);
    reminderStatus = body;
    reminderStatusFailed = false;
  } catch (e) {
    console.error(e);
    reminderStatusFailed = true;
  }
  // Only the views that show the status are redrawn: a render rebuilds the
  // whole page and would throw away a form being filled in on another tab.
  if (view === "reminders" || view === "log") render();
}

/** True when the hub says it is not sending this child's reminder (over the allowance). */
function reminderUnmonitored(babyId, kindId) {
  return (reminderStatus?.unmonitored ?? []).some((u) => u.subject_id === babyId && u.kind_id === kindId);
}

// "Feed reminder at 3:40 PM · Wake window reminder at 4:10 PM", under the day's
// summary. Nothing in a shared space, where the hub does not send them. Without
// the hub's status (a guest is refused it; or the check failed) whether it is
// sent is unknown, so the line gives the due time the parents set, which is
// true either way: "Feed due 3:40 PM".
function nextRemindersHtml(baby) {
  if (reminderStatus?.context_unsupported) return "";
  const due = nextReminders(baby, entries);
  // The hub gives up on a reminder 120 minutes after it fell due
  // (MAX_LATE_MINUTES), so the page stops showing it then too.
  const now = Date.now();
  const live = due.filter(({ dueAt }) => now - dueAt.getTime() <= 120 * 60000);
  if (!live.length) return "";
  const known = !!reminderStatus && !reminderStatusFailed;
  const parts = live.map(({ kind, dueAt }) => {
    const clock = fmtClock(dueAt.toISOString());
    const past = dueAt.getTime() <= now;
    if (!known) return `${kind.label} ${past ? "was due" : "due"} ${clock}`;
    return `${kind.label} reminder ${past ? "was due" : "at"} ${clock}${reminderUnmonitored(baby.id, kind.id) ? " (not being sent)" : ""}`;
  });
  return `<p class="muted tiny" data-testid="next-reminders" style="margin:8px 2px 0">${esc(parts.join(" · "))}</p>`;
}

// "Last temperature 101.2 °F, fever, 1:05 PM · Infant Tylenol 2.5 ml at 2:10 PM,
// not again before 6:10 PM": what the next caregiver must know first. The
// latest reading of the last day, and each medicine still inside its wait.
function healthLineHtml(temp, waits) {
  const parts = [];
  if (temp) parts.push(`Last temperature ${fmtTemp(temp.temp_c100, units)}${isFever(temp.temp_c100, units) ? ", fever" : ""}, ${fmtWhenShort(new Date(temp.started_at))}`);
  for (const w of waits) parts.push(doseWaitText(w));
  if (!parts.length) return "";
  return `<p class="muted tiny" data-testid="health-line" style="margin:8px 2px 0">${esc(parts.join(" · "))}</p>`;
}
function doseWaitText(w) {
  return `${w.name}${w.dose ? ` ${w.dose}` : ""} at ${fmtWhenShort(new Date(w.givenAt))}, not again before ${fmtWhenShort(w.notBefore)}`;
}
// The clock alone today, the day too when it is not.
function fmtWhenShort(date) {
  const iso = date.toISOString();
  return dayKey(iso) === dayKey(nowIso()) ? fmtClock(iso) : fmtWhen(iso);
}

function renderReminders(baby) {
  // A failed status check still shows the settings, under a banner: saving
  // does not need the status, and a parent must be able to turn a reminder off.
  if (!reminderStatus && !reminderStatusFailed) return `<div class="card empty">Checking the reminders…</div>`;
  // Any failed check says so, including a refresh after an earlier success:
  // the answer kept from then may be out of date.
  const banner = reminderStatusFailed ? `<div class="load-error" role="alert" data-testid="reminders-status-error"><span>Couldn’t check which reminders the hub is sending.</span> <button type="button" class="load-error-retry" data-reminders-retry>Try again</button></div>` : "";
  if (reminderStatus?.context_unsupported) {
    return `<div class="card stack" data-testid="reminders-unsupported">
      <h2>Reminders</h2>
      <div class="tiny">Reminders are sent in a household’s own Baby Log, not yet in a shared space. Set them up in the Baby Log of the home the baby is in.</div>
    </div>`;
  }
  const notes = [
    "While someone has a shift running, a reminder goes to whoever is on shift. Otherwise it goes to the adults.",
    reminderStatus?.escalation_entitled
      ? "If the reminder still stands 30 minutes later (no new feed or sleep logged, or the long sleep still going), the adults are told too."
      : "",
  ].filter(Boolean);
  return `${banner}
    <div class="section-head"><h2>Reminders for ${esc(baby.name)}</h2></div>
    <form class="card stack" id="reminders-form" data-baby-id="${esc(baby.id)}" data-testid="reminders-form">
      ${REMINDER_KINDS.map((kind) => {
        const current = reminderMinutes(baby, kind);
        const suggested = suggestedMinutes(kind.id, baby.birth_date);
        const options = reminderChoices(kind.id, current, suggested).map((m) =>
          `<option value="${m}" ${m === current ? "selected" : ""}>${esc(fmtMinutes(m))}${suggested != null && m === suggested ? " (suggested for age)" : ""}</option>`).join("");
        return `
        <div class="field">
          <label for="rem-${kind.id}">${esc(kind.label)}</label>
          <select id="rem-${kind.id}" data-reminder="${kind.id}">
            <option value="" ${current == null ? "selected" : ""}>Off</option>${options}
          </select>
          <div class="muted tiny">${esc(kind.what)}${current != null && reminderUnmonitored(baby.id, kind.id) ? ". <strong>Not being sent: the household is using all of its reminder slots.</strong>" : ""}</div>
        </div>`;
      }).join("")}
      <p class="muted tiny">Suggestions go by ${esc(baby.name)}’s age. They are a starting point, not medical advice: your pediatrician knows your baby.</p>
      <p class="muted tiny">${esc(notes.join(" "))}</p>
      <div class="modal-actions"><button type="submit" class="btn" data-testid="reminders-save" ${savingReminders ? "disabled" : ""}>Save reminders</button></div>
    </form>`;
}

/* ── The doctor-visit report ───────────────────────────────────────────────── */
// The hub renders these documents from the manifest's `reports`, as whoever
// asks, through the same row policies as the page's own reads; the full record
// binds them for one date range. Adults only: the hub refuses a guest, and
// taking the baby to the doctor is a parent's errand.
const records = { views: null, full: null, loading: false, failed: false };
let recordFrom = "", recordTo = "";
// Until someone picks a date the range is the default, which ends "today", so
// it is worked out each time it is used.
let recordRangeEdited = false;
function canReport() { return !!REPORTS_URL && canManage(); }
function loadRecords() {
  if (!REPORTS_URL || records.views || records.loading) return;
  records.loading = true; records.failed = false;
  fetch(REPORTS_URL, { headers: { Accept: "application/json" } })
    .then((res) => { if (!res.ok) throw new Error(`reports ${res.status}`); return res.json(); })
    .then((body) => { records.views = Array.isArray(body?.views) ? body.views : []; records.full = body?.full_record ?? null; })
    // A list that failed to load is not an empty list.
    .catch(() => { records.failed = true; })
    .finally(() => { records.loading = false; if (view === "report") render(); });
}
function openRecord(id, format) {
  if (!recordRangeEdited) ({ from: recordFrom, to: recordTo } = defaultRecordRange(hubToday()));
  const problem = recordRangeError(recordFrom, recordTo);
  if (problem) { showError(problem); return; }
  if (error) { error = ""; render(); }
  window.open(recordUrl(REPORTS_URL, id, format, recordFrom, recordTo, window.location.href), "_blank", "noopener");
}
function renderReport() {
  if (!records.views) {
    if (records.failed) return `<div class="card empty" data-testid="record-card">The report could not be loaded. <button class="btn btn-ghost btn-sm" data-records-retry>Try again</button></div>`;

  }
  if (!recordRangeEdited) ({ from: recordFrom, to: recordTo } = defaultRecordRange(hubToday()));

  const fullPdf = Array.isArray(records.full?.formats) && records.full.formats.includes("pdf");
  const button = (id, format, label, primary) => `<button class="btn btn-sm ${primary ? "" : "btn-ghost"}" data-report="${esc(id)}" data-format="${format}">${label}</button>`;

    <div class="card stack" data-testid="record-card">
      <div>One document with a daily summary of feeds, diapers and sleep, every entry, temperatures and medicines for a sick visit, and the growth measurements, for every child and the dates below. Open it and print it${fullPdf ? ", or download it as a PDF" : ", or save it as a PDF from the print dialog"}.</div>

      ${records.views.length ? `<div class="stack">${records.views.map((v) => `
        <div class="entry" data-testid="record-view" data-record="${esc(v.id)}">

function dayLabel(key) {
  const today = dayKey(nowIso());
  const yesterday = dayKey(new Date(Date.now() - 86400000).toISOString());
  if (key === today) return "Today";
  if (key === yesterday) return "Yesterday";
  const d = new Date(`${key}T12:00:00`);
  return new Intl.DateTimeFormat(undefined, { weekday: "short", month: "short", day: "numeric" }).format(d);
}

function renderEntry(e) {
  const meta = typeMeta(e.entry_type);
  const t = new Date(e.started_at);
  const time = Number.isNaN(t.getTime()) ? "" : new Intl.DateTimeFormat(undefined, { hour: "numeric", minute: "2-digit" }).format(t);
  const detail = entryDetail(e, units);
  return `

      <div class="entry-body">

}

// The report's dates: kept as typed, and from then on no longer the default.
document.addEventListener("change", (e) => {
  if (e.target.id !== "rec-from" && e.target.id !== "rec-to") return;
  if (e.target.id === "rec-from") recordFrom = e.target.value; else recordTo = e.target.value;
  recordRangeEdited = true;
});

// render() rewrites the whole view, so put the caret back after typing.
document.addEventListener("input", (e) => {
  if (e.target.id !== "search") return;
  searchQ = e.target.value;
  render();   // keeps the box's focus and caret (see render)
});

// Every redraw rebuilds the page from state, and a status answer can land while
// a parent is mid-change on the Reminders tab: carry the form's choices over
// for the same child, so only a save or a child switch replaces them.
function render() {
  const form = document.getElementById("reminders-form");
  const draft = form && [...form.querySelectorAll("[data-reminder]")].map((el) => [el.dataset.reminder, el.value]);
  // A timed redraw must not take the search box from someone typing in it.
  const searching = document.activeElement?.id === "search" ? [document.activeElement.selectionStart, document.activeElement.selectionEnd] : null;
  drawPage();
  const box = searching && document.getElementById("search");
  if (box) { box.focus(); box.setSelectionRange(...searching); }
  const next = document.getElementById("reminders-form");
  if (draft && next && next.dataset.babyId === form.dataset.babyId) {
    for (const [id, value] of draft) {
      const el = next.querySelector(`[data-reminder="${id}"]`);
      if (el && [...el.options].some((o) => o.value === value)) el.value = value;
    }
  }
}

function drawPage() {
  const root = document.getElementById("root");
  root.className = "app-root";

  if (loadFailed) {
    root.innerHTML = `
      <div class="topbar"><h1>Baby Log</h1></div>
      <div class="load-error" data-testid="load-error" role="alert"><span>Couldn’t load the baby log.</span> <button type="button" class="load-error-retry" data-testid="load-retry">Try again</button></div>`;
    return;
  }

  // No child yet still shows the shifts: a nanny can be at work before a
  // parent has added the baby, and a shift she started must stay endable.
  if (!babies.length) {
    root.innerHTML = `
      <div class="topbar"><h1>Baby Log</h1>${viewTabsHtml()}</div>
      ${error ? `<div class="error">${esc(error)}</div>` : ""}
      ${view === "shifts" ? renderShifts() : `
      <div class="card empty">
        No children yet.${canManage() ? "" : " Ask a parent to add one."}
        ${canManage() ? `<div style="margin-top:12px"><button class="btn" data-add-baby>+ Add your baby</button></div>` : ""}
      </div>
      ${shiftBarHtml()}
      ${handoffHtml()}`}`;
    return;
  }

  const baby = babies.find((b) => b.id === currentBabyId) ?? babies[0];
  const babyEntries = entries.filter((e) => e.baby_id === baby.id);
  const today = summarizeDay(babyEntries, dayKey(nowIso()));
  const sleeping = !!runningSleep(babyEntries, baby.id);
  const waits = nextDoses(entries, baby.id);
  const lastTemp = latestTemperature(entries, baby.id);
  // Search narrows the entries before they are grouped, so empty days drop out.
  const shownEntries = searchQ
    ? babyEntries.filter((e) => searchMatch(searchQ, searchableFields(e)))
    : babyEntries;
  const groups = groupByDay(shownEntries);
  const age = ageLabel(baby.birth_date);
  const babyTabs = babies.length > 1 ? `<div class="tabs">${babies.map((b) => `<button class="tab ${b.id === baby.id ? "active" : ""}" data-baby="${esc(b.id)}">${esc(b.emoji)} ${esc(b.name)}</button>`).join("")}</div>` : "";

  root.innerHTML = `
    <div class="topbar">
      <div>
        <h1>${esc(baby.emoji)} ${esc(baby.name)}</h1>
        <p class="muted tiny">${age ? `${esc(age)} old · ` : ""}shared caregiver log</p>
      </div>
      ${viewTabsHtml()}
    </div>
    ${error ? `<div class="error">${esc(error)}</div>` : ""}
    ${view === "growth" || view === "log" || view === "reminders" ? babyTabs : ""}
    ${view === "shifts" ? renderShifts() : view === "report" && canReport() ? renderReport() : view === "growth" ? renderGrowth(baby) : view === "reminders" && canManage() ? renderReminders(baby) : `
    <div class="summary">
      <div class="stat"><span class="v">${today.feedCount}</span><span class="k">Feeds today</span></div>
      <div class="stat"><span class="v">${today.lastFeedAt ? esc(timeAgo(today.lastFeedAt)) : "—"}</span><span class="k">Last feed</span></div>
      <div class="stat"><span class="v">${today.sleepMs ? esc(fmtDuration(today.sleepMs)) : "—"}${today.sleeping ? ` ${glyph("moon")}` : ""}</span><span class="k">Sleep today</span></div>
    </div>
    ${nextRemindersHtml(baby)}
    ${healthLineHtml(lastTemp, waits)}
    ${canLog() ? `
      <div class="quick">
        <button data-quick="feed"><span class="q-icon">${glyph("bottle")}</span>Feed</button>
        <button data-quick="diaper"><span class="q-icon">${glyph("diaper")}</span>Diaper</button>
        <button data-quick="sleep" class="${sleeping ? "sleeping" : ""}"><span class="q-icon">${glyph("moon")}</span>${sleeping ? "End sleep" : "Sleep"}</button>
        <button data-quick="temperature"><span class="q-icon">${glyph("thermometer")}</span>Temp</button>
        <button data-quick="medicine"><span class="q-icon">${glyph("pill")}</span>Medicine</button>
        <button data-quick="more"><span class="q-icon">${glyph("plus")}</span>More</button>
      </div>` : ""}
    ${shiftBarHtml()}
    ${handoffHtml()}
    ${babyEntries.length ? `<div class="search-row"><input id="search" class="search-input" type="search" placeholder="Search the log…" aria-label="Search the log" value="${esc(searchQ)}" /></div>` : ""}
    ${groups.length
      ? groups.map((g) => `
          <div class="day-head">${esc(dayLabel(g.key))}</div>
          <div class="stack">${g.entries.map(renderEntry).join("")}</div>`).join("")
      : `<div class="card empty">${searchQ ? `Nothing matches "${esc(searchQ)}".` : `Nothing logged yet${canLog() ? " — tap a button above to start" : ""}.`}</div>`}
    `}
  `;

  // Keep the running-sleep total ticking without a full data reload. On the
  // log only: a render rebuilds the whole view, and on another tab it would
  // throw away a date or a number being typed.
  clearTimeout(tickTimer);   // clears an interval too
  // The health line changes too, but rarely, so it redraws once, at the next
  // change rather than every minute: a wait ending, the last reading leaving
  // after 24 hours, a dose or reading dated ahead coming due, and midnight,
  // when a time from the day before gains its date.
  if (sleeping && view === "log") tickTimer = setInterval(render, 60000);
  else if (view === "log") {
    const at = healthLineChangesAt(entries, baby.id);
    if (at != null) tickTimer = setTimeout(render, Math.min(at - Date.now() + 1000, 2 ** 31 - 1));
  }
}

/* ── Modals ────────────────────────────────────────────────────────────────── */
function openModal(html) {
  closeModal();
  modalEl = document.createElement("div");
  modalEl.className = "overlay";
  modalEl.innerHTML = `<div class="modal">${html}</div>`;
  modalEl.addEventListener("click", (e) => { if (e.target === modalEl) closeModal(); });
  document.body.appendChild(modalEl);
}
function closeModal() { modalEl?.remove(); modalEl = null; }

function localDatetimeValue(iso) {
  const d = iso ? new Date(iso) : new Date();
  if (Number.isNaN(d.getTime())) return "";
  const pad = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
