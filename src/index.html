function openEntryEditor(existing, presetType) {
  const e = existing ?? null;
  const type = e?.entry_type ?? presetType ?? "feed";
  const typeOptions = ENTRY_TYPES.map((t) => `<option value="${t.value}" ${t.value === type ? "selected" : ""}>${t.label}</option>`).join("");
  // The doses this form judges by: the page's log, then the doses as read
  // again when Log it is pressed (kept in the form, not put back in the page's).
  let doseLog = entries;
  // The medicines this child has had, newest first: a repeat dose is one tap
  // on the newest six, and any of them typed fills in its wait.
  let meds = recentMedicines(doseLog, e?.baby_id ?? currentBabyId);
  const chipsHtml = () => meds.slice(0, 6).map((m, i) => `<button type="button" class="tab" data-med-fill="${i}">${esc(m.med_name)}${m.med_dose ? ` · ${esc(m.med_dose)}` : ""}</button>`).join("");
  const storedRepeat = e?.repeat_after_min == null || e.repeat_after_min === "" ? null : Number(e.repeat_after_min);
  const repeatOptions = (selected) => `<option value="">Not said</option>${repeatChoices(selected).map((m) => `<option value="${m}" ${m === selected ? "selected" : ""}>${fmtMinutes(m)}</option>`).join("")}`;
  const tempUnit = units === "imperial" ? "°F" : "°C";
  openModal(`
    <h2>${e ? "Edit entry" : "Log " + esc(typeMeta(type).label.toLowerCase())}</h2>
    <form class="form" id="entry-form">
      <div class="field"><label for="f-type">Type</label><select id="f-type">${typeOptions}</select></div>
      <div class="grid2">
        <div class="field"><label for="f-start">Started</label><input id="f-start" type="datetime-local" value="${esc(localDatetimeValue(e?.started_at))}" required /></div>
        <div class="field" data-show="sleep pump"><label for="f-end">Ended</label><input id="f-end" type="datetime-local" value="${e?.ended_at ? esc(localDatetimeValue(e.ended_at)) : ""}" /></div>
      </div>
      <div class="grid2">
        <div class="field" data-show="feed"><label for="f-feedkind">How</label>
          <select id="f-feedkind">
            ${["bottle", "nurse-left", "nurse-right", "solids"].map((k) => `<option value="${k}" ${e?.feed_kind === k ? "selected" : ""}>${feedKindLabel(k)}</option>`).join("")}
          </select>
        </div>
        <div class="field" data-show="feed pump"><label for="f-amount">Amount (ml)</label><input id="f-amount" type="number" min="0" max="2000" value="${esc(e?.amount_ml ?? "")}" /></div>
        <div class="field" data-show="diaper"><label for="f-diaperkind">Diaper</label>
          <select id="f-diaperkind">
            ${["wet", "dirty", "both"].map((k) => `<option value="${k}" ${e?.diaper_kind === k ? "selected" : ""}>${diaperKindLabel(k)}</option>`).join("")}
          </select>
        </div>
        <div class="field" data-show="temperature"><label for="f-temp">Temperature (${tempUnit})</label><input id="f-temp" type="number" step="any" inputmode="decimal" value="${esc(tempValue(e?.temp_c100, units))}" /></div>
        <div class="field" data-show="temperature"><label for="f-method">Taken</label>
          <select id="f-method">
            <option value="">Not said</option>
            ${TEMP_METHODS.map((m) => `<option value="${m.value}" ${e?.temp_method === m.value ? "selected" : ""}>${m.label}</option>`).join("")}
          </select>
        </div>
      </div>
      ${!e ? `<div class="field" data-show="medicine" data-testid="med-chips" ${meds.length ? "" : "hidden"}><span class="muted tiny">Given before</span><div class="tabs" id="f-medchips">${chipsHtml()}</div></div>` : ""}
      <div class="grid2">
        <div class="field" data-show="medicine"><label for="f-medname">Medicine</label><input id="f-medname" type="text" maxlength="80" autocomplete="off" value="${esc(e?.med_name ?? "")}" /></div>
        <div class="field" data-show="medicine"><label for="f-meddose">Dose <span class="muted" style="text-transform:none">(e.g. 2.5 ml)</span></label><input id="f-meddose" type="text" maxlength="40" autocomplete="off" value="${esc(e?.med_dose ?? "")}" /></div>
      </div>
      ${!e ? `<p class="error" data-show="medicine" data-testid="dose-wait" role="status" hidden></p>` : ""}
      <div class="field" data-show="medicine"><label for="f-repeat">Next dose no sooner than</label><select id="f-repeat">${repeatOptions(storedRepeat)}</select>
        <span class="muted tiny">As the label or your doctor says. The log shows when the next dose may be given; it never sends a reminder to give one.</span></div>
      <div class="field"><label for="f-note">Note <span class="muted" style="text-transform:none">(optional)</span></label><textarea id="f-note">${esc(e?.note ?? "")}</textarea></div>
      <div class="error" data-form-error data-testid="modal-error" role="alert" hidden></div>
      <div class="modal-actions">
        ${e && canManage() ? `<button type="button" class="btn btn-danger modal-left" data-delete="${esc(e.id)}">Delete</button>` : ""}
        <button type="button" class="btn btn-ghost" data-cancel>Cancel</button>
        <button type="submit" class="btn">${e ? "Save" : "Log it"}</button>
      </div>
    </form>`);

  const applyVisibility = () => {
    const t = modalEl.querySelector("#f-type").value;
    modalEl.querySelectorAll("[data-show]").forEach((el) => {
      el.style.display = el.getAttribute("data-show").split(" ").includes(t) ? "" : "none";
    });
  };
  applyVisibility();
  modalEl.querySelector("#f-type").addEventListener("change", applyVisibility);
  // A new dose of a medicine still inside its wait says so, as the log does,
  // before it is saved. It does not stop the save: a doctor may have said otherwise.
  const waitLine = modalEl.querySelector("[data-testid=dose-wait]");
  const showWait = () => {
    if (!waitLine) return;
    // As of the Started time on the form, either side of it (see doseWait).
    const start = new Date(document.getElementById("f-start").value);
    const chosen = document.getElementById("f-repeat").value;
    // The dose this form already stored on a try whose answer was lost (its
    // pinned id) is the one being saved, not one to warn about.
    const pinned = modalEl.querySelector("#entry-form")?.dataset.rowId ?? null;
    // Each dose either side it would come too close to, so the check at submit
    // sees one logged on either side since.
    const ws = doseWaits(doseLog, currentBabyId, document.getElementById("f-medname").value, Number.isNaN(start.getTime()) ? new Date() : start, chosen === "" ? null : Number(chosen), pinned);
    waitLine.textContent = ws.map((w) => `Given: ${doseWaitText(w)}.`).join(" ");
    // Which doses and waits, for the check at submit: the text changes at
    // midnight, and two doses logged in the same minute read the same.
    waitLine.dataset.key = ws.map((w) => `${w.id}|${w.notBefore.toISOString()}`).join(" ");
    waitLine.hidden = !ws.length;
  };
  document.getElementById("f-start").addEventListener("change", showWait);
  document.getElementById("f-repeat").addEventListener("change", showWait);
  // A new dose carries a wait of its own: a medicine given before (a chip,
  // or its name typed) fills in the wait its last dose had, unless one was
  // picked here. A name not given before clears a wait filled for another.
  let repeatPicked = false;
  document.getElementById("f-repeat").addEventListener("change", () => { repeatPicked = true; });
  const fillWait = () => {
    if (e || repeatPicked) return;
    const m = knownMedicine(meds, document.getElementById("f-medname").value);
    document.getElementById("f-repeat").innerHTML = repeatOptions(m?.repeat_after_min ?? null);
  };
  document.getElementById("f-medname").addEventListener("input", () => { fillWait(); showWait(); });
  modalEl.querySelector("#f-medchips")?.addEventListener("click", (ev) => {
    const btn = ev.target.closest("[data-med-fill]");
    const m = btn && meds[Number(btn.dataset.medFill)];
    if (!m) return;
    document.getElementById("f-medname").value = m.med_name;
    document.getElementById("f-meddose").value = m.med_dose;
    fillWait();
    showWait();
  });

  // The times as the form opened with them. The inputs hold minutes only, so
  // a time left alone keeps the stored one rather than being rewritten from
  // the rounded copy (see saveEntry: only what changed is written).
  const openedStart = document.getElementById("f-start").value;
  const openedEnd = document.getElementById("f-end")?.value ?? "";
  // Likewise the reading: one left alone keeps its stored hundredths.
  const openedTemp = document.getElementById("f-temp").value;
  modalEl.querySelector("#entry-form").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const form = ev.currentTarget;
    // A new dose is judged against the doses as they are now: another
    // caregiver may have given one since the page read the log. One inside a
    // wait the form has not shown yet is shown first; pressing again saves it.
    // Read before any field is taken, so what is judged is what is saved.
    // Offline, the doses the form has are all there is to judge by.
    if (waitLine && document.getElementById("f-type").value === "medicine") {
      const shown = new Set(waitLine.hidden ? [] : waitLine.dataset.key.split(" "));
      const btn = form.querySelector('button[type="submit"]');
      if (btn) btn.disabled = true;
      doseLog = DB ? await readDoses().catch(() => doseLog) : doseLog;
      if (btn) btn.disabled = false;
      if (!modalEl?.contains(form)) return;
      meds = recentMedicines(doseLog, currentBabyId);
      document.getElementById("f-medchips").innerHTML = chipsHtml();
      modalEl.querySelector("[data-testid=med-chips]").hidden = !meds.length;
      // The wait is saved as the form shows it: the read holds only the newest
      // doses, and is no reason to change a wait already filled in.
      showWait();
      // Only while it is still a dose: a type changed during the read saves as it is.
      const unseen = waitLine.dataset.key.split(" ").some((k) => k && !shown.has(k));
      if (document.getElementById("f-type").value === "medicine" && !waitLine.hidden && unseen) return;
    }
    const entryType = document.getElementById("f-type").value;
    const startRaw = document.getElementById("f-start").value;
    if (!startRaw) { document.getElementById("f-start").focus(); return; }
    const endRaw = document.getElementById("f-end")?.value ?? "";
    const showsEnd = ["sleep", "pump"].includes(entryType);
    const amountRaw = document.getElementById("f-amount")?.value ?? "";
    const amount = ["feed", "pump"].includes(entryType) && amountRaw !== "" ? Number(amountRaw) : null;
    // Said in the form's own error line: the page's line is under the overlay.
    const line = form.querySelector("[data-form-error]");
    const start = new Date(startRaw);
    const end = showsEnd && endRaw ? new Date(endRaw) : null;
    // toISOString throws on a date it could not parse.
    if (Number.isNaN(start.getTime()) || (end && Number.isNaN(end.getTime()))) { line.textContent = "Enter a valid date and time."; line.hidden = false; return; }
    const startedAt = e && startRaw === openedStart ? e.started_at : start.toISOString();
    const endedAt = e && showsEnd && e.entry_type === entryType && endRaw === openedEnd ? (e.ended_at || null) : (end ? end.toISOString() : null);
    if (endedAt && endedAt < startedAt) { line.textContent = "End time is before start time."; line.hidden = false; return; }
    const tempRaw = document.getElementById("f-temp").value;
    // A reading left alone keeps its stored value and is not judged again: a
    // stored one the form cannot hold must not block a fix to the note or time.
    const tempKept = !!e && e.entry_type === "temperature" && tempRaw === openedTemp;
    const tempC100 = entryType !== "temperature" ? null : tempKept ? e.temp_c100 : tempC100From(tempRaw, units);
    const repeatRaw = document.getElementById("f-repeat").value;
    const med = entryType !== "medicine" ? { med_name: "", med_dose: "", repeat_after_min: null } : {
      med_name: document.getElementById("f-medname").value.trim(),
      med_dose: document.getElementById("f-meddose").value.trim(),
      // A stored wait the list cannot show (written some other way) is kept
      // unless the wait was changed here.
      repeat_after_min: e && e.entry_type === "medicine" && !repeatPicked ? (e.repeat_after_min ?? null) : repeatRaw === "" ? null : Number(repeatRaw),
    };
    const invalid = entryType === "temperature" ? (tempKept ? "" : tempError(tempC100)) : entryType === "medicine" ? medicineError(med) : "";
    if (invalid) { line.textContent = invalid; line.hidden = false; return; }
    line.hidden = true;
    const btn = modalEl?.querySelector('button[type="submit"]');
    if (btn) { btn.dataset.label = btn.textContent; btn.disabled = true; btn.textContent = "Saving…"; }
    saveEntry({
      entry_type: entryType,
      started_at: startedAt,
      ended_at: endedAt,
      amount_ml: Number.isFinite(amount) ? amount : null,
      feed_kind: entryType === "feed" ? document.getElementById("f-feedkind").value : "",
      diaper_kind: entryType === "diaper" ? document.getElementById("f-diaperkind").value : "",
      temp_c100: tempC100,
      temp_method: entryType === "temperature" ? document.getElementById("f-method").value : "",
      ...med,
      note: document.getElementById("f-note").value.trim(),
    }, e?.id ?? null, form.dataset, e).catch((err) => saveFailed(err, { action: "save the entry", thing: "entry" }));
  });
}

/* ── Events ────────────────────────────────────────────────────────────────── */
document.addEventListener("submit", (e) => {
  if (e.target.id !== "reminders-form") return;
  e.preventDefault();
  const values = {};
  for (const kind of REMINDER_KINDS) {
    const raw = e.target.querySelector(`[data-reminder="${kind.id}"]`)?.value ?? "";
    values[kind.column] = raw === "" ? null : Number(raw);
  }
  saveReminders(e.target.dataset.babyId, values);
});

document.addEventListener("click", (e) => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.matches('[data-testid="load-retry"]')) { refresh(); return; }
  if (t.hasAttribute("data-baby")) { currentBabyId = t.getAttribute("data-baby"); render(); return; }
  if (t.hasAttribute("data-view")) {
    view = t.getAttribute("data-view");
    render();
    // Fetched once at load and after each save; a second fetch on every tab
    // visit would redraw over a choice made before it answered.
    if (view === "reminders" && !reminderStatus) loadReminderStatus();
    return;
  }
  if (t.hasAttribute("data-reminders-retry")) { reminderStatusFailed = false; render(); loadReminderStatus(); return; }
  if (t.hasAttribute("data-start-shift")) { startShift(); return; }
  if (t.hasAttribute("data-end-shift")) { openShiftEditor(t.getAttribute("data-end-shift"), true); return; }
  if (t.hasAttribute("data-edit-shift")) { openShiftEditor(t.getAttribute("data-edit-shift")); return; }
  if (t.hasAttribute("data-delete-shift")) { deleteShift(t.getAttribute("data-delete-shift")); return; }
  if (t.hasAttribute("data-add-baby")) { openBabyEditor(); return; }
  if (t.hasAttribute("data-set-sex")) { setBabySex(t.getAttribute("data-baby-id"), t.getAttribute("data-set-sex")); return; }
  if (t.hasAttribute("data-units")) { setUnits(t.getAttribute("data-units")); return; }
  if (t.hasAttribute("data-add-growth")) { openGrowthEditor(null); return; }
  if (t.hasAttribute("data-edit-growth")) { openGrowthEditor(growth.find((x) => x.id === t.getAttribute("data-edit-growth"))); return; }
  if (t.hasAttribute("data-delete-growth")) { deleteGrowth(t.getAttribute("data-delete-growth")); return; }
  if (t.hasAttribute("data-records-retry")) { records.failed = false; render(); return; }
  if (t.hasAttribute("data-report")) { openRecord(t.getAttribute("data-report"), t.getAttribute("data-format")); return; }
  if (t.hasAttribute("data-cancel")) { closeModal(); return; }
  if (t.hasAttribute("data-edit")) { openEntryEditor(entries.find((x) => x.id === t.getAttribute("data-edit"))); return; }
  if (t.hasAttribute("data-delete")) { deleteEntry(t.getAttribute("data-delete")); return; }
  if (t.hasAttribute("data-quick")) {
    const q = t.getAttribute("data-quick");
    if (q === "sleep") { toggleSleep().catch((err) => { console.error(err); showError(failureLine(err, { action: "save the sleep timer", thing: "entry" })); }); return; }
    if (q === "more") { openEntryEditor(null, "note"); return; }
    openEntryEditor(null, q);
  }
});

// Back to a page left open (a phone unlocked, a tab switched to): read the log
// again, so the health line shows a dose another caregiver gave meanwhile.
document.addEventListener("visibilitychange", () => {
  // Not again within half a minute: flipping between apps would read the
  // whole log, and have the hub open every row, each time.
  if (document.visibilityState !== "visible" || loadFailed || !babies.length || Date.now() - lastReadAt < 30000) return;
  lastReadAt = Date.now();   // tried, whether or not it lands
  rereadEntries().catch((err) => console.error(err));
});

refresh();
</script>
